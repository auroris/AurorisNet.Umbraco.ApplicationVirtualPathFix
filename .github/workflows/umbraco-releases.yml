name: New Umbraco releases

# Looks each Monday for new releases of the Umbraco major versions the package supports, and runs the quick tests and the
# browser cases on those releases only. A release that passes is added to UmbracoReleases on main, and the weekly
# release publishes a package for it. A release that fails gets an issue. The jobs come from auroris/AurorisNet.Build,
# whose docs/releasing.md describes them.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      releases:
        description: Releases to test instead of the new ones, separated by commas, such as 18.3.2,17.8.2
        required: false
        default: ''
      dry-run:
        description: Show the results in the run only, without a commit or an issue
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: umbraco-releases
  cancel-in-progress: false

jobs:
  umbraco:
    uses: auroris/AurorisNet.Build/.github/workflows/umbraco-releases.yml@main
    permissions:
      actions: write
      contents: write
      issues: write
    with:
      runs-on: windows-latest
      timeout-minutes: 180
      # The package's own script builds each release and runs the quick tests, then the browser cases. A summary that is
      # missing, as when Chromium could not be installed, fails every release.
      test-script: |
        pwsh tests/Test-UmbracoReleases.ps1 -Releases $env:RELEASES -SummaryPath artifacts/quick.json
        dotnet build tests/AurorisNet.Umbraco.ApplicationVirtualPathFix.Tests -nologo
        pwsh tests/AurorisNet.Umbraco.ApplicationVirtualPathFix.Tests/bin/Debug/net10.0/playwright.ps1 install chromium
        if ($LASTEXITCODE -eq 0) { pwsh tests/Test-UmbracoReleases.ps1 -Releases $env:RELEASES -Browser -SummaryPath artifacts/browser.json }
      summaries: artifacts/quick.json,artifacts/browser.json
      # The traces and screenshots of the browser cases, without the crash dumps.
      artifacts: |
        artifacts/umbraco-releases/*/artifacts/bin/AurorisNet.Umbraco.ApplicationVirtualPathFix.Tests/debug/e2e-artifacts/
        !**/*.dmp
      releases: ${{ inputs.releases || '' }}
      dry-run: ${{ inputs.dry-run || false }}
