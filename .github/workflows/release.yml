name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    # The tests run before a release, locally or in the New Umbraco releases workflow, as docs/DEVELOPING.md describes, so
    # this job only builds and publishes.
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    env:
      PACKAGE_PROJECT: src/AurorisNet.Umbraco.ApplicationVirtualPathFix.csproj
      ContinuousIntegrationBuild: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'

      # Each release publishes the same package once for each supported Umbraco major version, numbered after that major
      # version's newest supported release, such as 18.3.1.2 and 17.8.1.1. The newest major version's comes first.
      - name: Choose the package versions
        id: version
        env:
          RELEASE_BRANCH: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          $releases = @(& .github/scripts/Get-ReleaseVersion.ps1 -BranchName $env:RELEASE_BRANCH -Commit $env:RELEASE_COMMIT)
          $releases | Format-Table Umbraco, Version, Tag -AutoSize | Out-String | Write-Host
          "versions=$($releases.Version -join ',')" >> $env:GITHUB_OUTPUT
          "tags=$($releases.Tag -join ',')" >> $env:GITHUB_OUTPUT

      # Build each version on its own, so each package's assembly carries that package's version.
      - name: Build and pack
        env:
          RELEASE_VERSIONS: ${{ steps.version.outputs.versions }}
        run: |
          foreach ($version in $env:RELEASE_VERSIONS.Split(',')) {
            dotnet build "$env:PACKAGE_PROJECT" -c Release -p:Version=$version
            if ($LASTEXITCODE -ne 0) { throw "Could not build $version." }
            dotnet pack "$env:PACKAGE_PROJECT" -c Release --no-build -p:Version=$version -o artifacts/packages
            if ($LASTEXITCODE -ne 0) { throw "Could not pack $version." }
          }

      # Reserve every tag before publishing any package, so a retried run reuses all of them.
      - name: Reserve the release tags before publishing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAGS: ${{ steps.version.outputs.tags }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          foreach ($tag in $env:RELEASE_TAGS.Split(',')) {
            $existing = git tag --list "$tag"
            if ($LASTEXITCODE -ne 0) { throw 'Could not check release tags.' }
            if (!$existing) {
              gh api --method POST "repos/$env:GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$tag" -f "sha=$env:RELEASE_COMMIT"
              if ($LASTEXITCODE -ne 0) { throw "Could not reserve the release tag $tag." }
            }
          }

      - name: Log in to NuGet with trusted publishing
        id: nuget-login
        uses: NuGet/login@ebc737b6fc418a6ca0073cf116ec8dc156d8b81e # v1
        with:
          user: AurorisNet

      - name: Publish to NuGet
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          RELEASE_VERSIONS: ${{ steps.version.outputs.versions }}
        run: |
          foreach ($version in $env:RELEASE_VERSIONS.Split(',')) {
            dotnet nuget push "artifacts/packages/AurorisNet.Umbraco.ApplicationVirtualPathFix.$version.nupkg" `
              --source https://api.nuget.org/v3/index.json --api-key "$env:NUGET_API_KEY" --skip-duplicate
            if ($LASTEXITCODE -ne 0) { throw "Could not publish $version to NuGet." }
          }

      # The newest major version's release gets generated notes and stays the latest. Each other release points to it,
      # since it publishes the same package under another version number.
      - name: Publish the GitHub releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSIONS: ${{ steps.version.outputs.versions }}
          RELEASE_TAGS: ${{ steps.version.outputs.tags }}
        run: |
          $versions = $env:RELEASE_VERSIONS.Split(',')
          $tags = $env:RELEASE_TAGS.Split(',')
          for ($i = 0; $i -lt $versions.Count; $i++) {
            $package = "artifacts/packages/AurorisNet.Umbraco.ApplicationVirtualPathFix.$($versions[$i]).nupkg"
            gh release view "$($tags[$i])" --json id 2>$null | Out-Null
            if ($LASTEXITCODE -eq 0) {
              gh release upload "$($tags[$i])" "$package" --clobber
            } elseif ($i -eq 0) {
              gh release create "$($tags[$i])" "$package" --verify-tag --title "$($versions[$i])" --generate-notes --latest
            } else {
              $notes = "The same package as [$($versions[0])](https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$($tags[0])), " +
                "numbered for sites on Umbraco $($versions[$i].Split('.')[0]), which can float on ``$($versions[$i].Split('.')[0]).*``."
              gh release create "$($tags[$i])" "$package" --verify-tag --title "$($versions[$i])" --notes "$notes" --latest=false
            }
            if ($LASTEXITCODE -ne 0) { throw "Could not publish the GitHub release $($tags[$i])." }
          }
